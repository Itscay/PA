[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-assistant"
version = "0.1.0"
description = "Local-first Windows voice assistant (wake word -> STT -> intents -> skills)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17",
    "openWakeWord>=0.6",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pc-assistant = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
# 3.12 target: newer numpy stubs use `type` statements; our own code stays
# 3.11-compatible (requires-python) and avoids 3.12+ syntax.
python_version = "3.12"
exclude = ["tests/", "\\.venv/"]

# Audio-stack libs ship no py.typed markers; they are wrapped behind our own
# typed interfaces (assistant/audio/*), so missing stubs are acceptable here.
[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "pynput",
    "pynput.*",
    "ctranslate2",
    "faster_whisper",
    "pyttsx3",
    "onnxruntime",
    "openwakeword",
    "openwakeword.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "windows: needs real Windows integration (runner or live PC)",
]

[tool.coverage.run]
source = ["assistant"]
branch = true

[tool.coverage.report]
show_missing = true
