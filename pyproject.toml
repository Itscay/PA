[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-assistant"
version = "0.1.0"
description = "Local-first Windows voice assistant (wake word -> STT -> intents -> skills)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pc-assistant = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/", "\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "windows: needs real Windows integration (runner or live PC)",
]

[tool.coverage.run]
source = ["assistant"]
branch = true

[tool.coverage.report]
show_missing = true
