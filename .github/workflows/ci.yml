name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check assistant tests
      - name: Mypy (strict on core)
        run: mypy assistant
      - name: Pytest + coverage
        run: pytest --cov=assistant --cov-report=term-missing --cov-fail-under=80
      - name: State machine coverage must be 100%
        run: pytest tests/test_state.py --cov=assistant.core.state --cov-report=term-missing --cov-fail-under=100
      - name: Demo smoke test
        shell: bash
        run: printf 'open chrome\nshut down\nyes\nquit\n' | python -m assistant --demo
